<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>GPU SID Synth</title>
  <desc>A Commodore 64 SID synthesizer and PSID player, with a cyan sawtooth trace on a blue oscilloscope.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#b4aa97"/>
      <stop offset="1" stop-color="#8e8576"/>
    </linearGradient>
    <pattern id="grid" width="52" height="40" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V40" fill="none" stroke="#706deb" stroke-opacity=".35"/>
    </pattern>
    <clipPath id="screen">
      <rect x="80" y="330" width="1040" height="190"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect x="32" y="30" width="1136" height="580" rx="22" fill="#756650"/>
  <rect x="32" y="20" width="1136" height="580" rx="22" fill="#b2a387" stroke="#e5dbc7" stroke-width="2"/>
  <rect x="48" y="22" width="1104" height="574" rx="12" fill="#c6b99f"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#352f29">
    <text x="80" y="79" font-family="monospace" font-size="18" letter-spacing="3" fill="#625746">LIBSIDGPU / WEBGL 2 AUDIO</text>
    <text x="76" y="164" font-size="80" font-weight="700" letter-spacing="-3">GPU SID <tspan font-weight="400" fill="#6a5038">Synth</tspan></text>
    <g>
      <rect x="80" y="189" width="1040" height="5" fill="#b94335"/>
      <rect x="80" y="194" width="1040" height="5" fill="#cf7835"/>
      <rect x="80" y="199" width="1040" height="5" fill="#e3b84c"/>
      <rect x="80" y="204" width="1040" height="5" fill="#60926b"/>
      <rect x="80" y="209" width="1040" height="5" fill="#477b9d"/>
    </g>
    <text x="80" y="256" font-size="28">Commodore 64 SID synthesizer &amp; PSID player</text>
  </g>
  <rect x="76" y="288" width="1048" height="240" rx="3" fill="#2e2c9b" stroke="#706deb" stroke-width="8"/>
  <g font-family="monospace" font-size="14" fill="#75cec8" letter-spacing="2">
    <text x="96" y="316">SID OUTPUT</text>
    <text x="1104" y="316" text-anchor="end">MOS 8580 / 3 VOICES</text>
  </g>
  <g clip-path="url(#screen)">
    <rect x="80" y="330" width="1040" height="190" fill="url(#grid)"/>
    <path d="M80 425H1120" stroke="#706deb"/>
    <path d="M80 484L210 366V484L340 366V484L470 366V484L600 366V484L730 366V484L860 366V484L990 366V484L1120 366"
      fill="none" stroke="#75cec8" stroke-opacity=".15" stroke-width="14" stroke-linejoin="round"/>
    <path d="M80 484L210 366V484L340 366V484L470 366V484L600 366V484L730 366V484L860 366V484L990 366V484L1120 366"
      fill="none" stroke="#75cec8" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g font-family="monospace" font-size="18" fill="#625746">
    <text x="80" y="569">sid.pasqualefiorillo.it</text>
    <text x="1120" y="569" text-anchor="end">GPU SYNTHESIS</text>
  </g>
</svg>
